# Practice challenges. One YAML document per challenge, separated by ---.
# Fields: id, title, difficulty, topic, lesson (optional), then the exercise fields.
id: count-lines
title: How long is that file?
difficulty: beginner
topic: Text tools
lesson: head-tail-wc
kind: command
prompt: "Print just the number of lines in `~/notes.txt` — no file name after it."
solution: wc -l < ~/notes.txt
hints:
  - "`wc -l FILE` prints the name too. How can wc read the file without knowing its name?"
explanation: "Redirecting the file to stdin (`< file`) means wc has no name to print."
