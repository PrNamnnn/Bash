id: namerefs
title: Fill the caller's array
difficulty: advanced
topic: Functions
lesson: indirection-and-namerefs
kind: script
prompt: "Write `split_csv_line LINE OUT` that splits LINE on commas into the array named OUT (using a nameref). Then split the first data line of `~/data/users.csv` and print `name=… role=…`."
starter: |
  #!/usr/bin/env bash
  split_csv_line() {
    :
  }
solution: |
  #!/usr/bin/env bash
  split_csv_line() {
    local -n _out=$2
    IFS=, read -ra _out <<< "$1"
  }
  line=$(sed -n 2p ~/data/users.csv)
  split_csv_line "$line" fields
  echo "name=${fields[1]} role=${fields[3]}"
expectedOutput: name=Alice Johnson role=admin
checks:
  - pattern: (local|declare) -n
    message: Use a nameref.
hints:
  - "`local -n _out=$2` makes `_out` an alias for the caller's variable."
explanation: "Namerefs let a function return an array without eval or global variables."
