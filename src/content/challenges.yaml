id: awk-average
title: Average order size
difficulty: intermediate
topic: awk
lesson: awk-fundamentals
kind: command
prompt: "Print the average of the `units` column (column 4) of `~/data/sales.csv`, skipping the header, with two decimals."
solution: awk -F, 'NR > 1 { s += $4; n++ } END { printf "%.2f\n", s / n }' ~/data/sales.csv
hints:
  - "Accumulate a sum and a count, divide in END."
explanation: "awk keeps state across lines, so aggregates take one pass."
