id: parallel-wait
title: Collect every status
difficulty: expert
topic: Job control
lesson: job-control
kind: script
prompt: "Run `check` (given) for hosts `a b c d` in the background, then wait for each PID and print `HOST ok` or `HOST failed`, in host order, followed by `failures: N`."
starter: |
  #!/usr/bin/env bash
  check() { [[ $1 != c ]]; }
solution: |
  #!/usr/bin/env bash
  check() { [[ $1 != c ]]; }
  declare -A pid
  for h in a b c d; do check "$h" & pid[$h]=$!; done
  failures=0
  for h in a b c d; do
    if wait "${pid[$h]}"; then echo "$h ok"; else echo "$h failed"; (( ++failures )); fi
  done
  echo "failures: $failures"
expectedOutput: |
  a ok
  b ok
  c failed
  d ok
  failures: 1
checks:
  - pattern: '&'
    message: Start the checks in the background.
  - pattern: wait
    message: Collect the results with wait.
hints:
  - "Store each `$!` keyed by host."
  - "`wait PID` returns that job's exit status."
explanation: "A bare `wait` would always return 0; waiting per PID recovers each result."
