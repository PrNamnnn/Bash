id: fix-the-test
title: The broken comparison
difficulty: beginner
topic: Conditionals
lesson: if-statements
kind: find-bug
prompt: This script should print `big` for numbers over 100 but prints nothing for 9 and `big` for 50. Which line is wrong?
code: |
  #!/usr/bin/env bash
  n=$1
  if [ "$n" > 100 ]; then
    echo big
  fi
answer: 3
fix: |
  if [ "$n" -gt 100 ]; then
hints:
  - "Inside `[ ]`, what does `>` mean to the shell?"
explanation: "`>` is a redirection here: it creates a file named 100 and the test checks only that `$n` is non-empty. Use `-gt` (or `(( n > 100 ))`)."
