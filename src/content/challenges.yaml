id: atomic-write
title: Never half-written
difficulty: advanced
topic: Robust scripts
lesson: atomicity-and-idempotency
kind: mcq
prompt: "A script regenerates `/srv/www/index.html` every minute. Readers occasionally see a truncated page. What's the best fix?"
options:
  - "Write with `>>` instead of `>`"
  - "Generate into a temp file in /srv/www and `mv` it over index.html"
  - "Add `sleep 1` before writing"
  - "Generate in /tmp and `cp` it over index.html"
answer: 1
explanation: "Renaming within one filesystem is atomic. cp from /tmp still writes the destination progressively."
