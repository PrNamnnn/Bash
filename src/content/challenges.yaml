id: quote-predict
title: Spot the splitting
difficulty: beginner
topic: Quoting
lesson: quoting
kind: predict
prompt: What does this print?
code: |
  msg="two   spaces"
  echo $msg
  echo "$msg"
answer: |
  two spaces
  two   spaces
explanation: Unquoted, the value is split into words and echo joins them with single spaces. Quoted, it stays exactly as stored.
