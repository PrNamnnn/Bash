id: assoc-count
title: Sessions per user
difficulty: advanced
topic: Associative arrays
lesson: associative-arrays
kind: script
prompt: "Count log lines per user in `~/logs/app.log` (lines contain `user=NAME`). Print `NAME COUNT` sorted by count descending, then name; ignore lines without a user."
starter: |
  #!/usr/bin/env bash
  declare -A n
solution: |
  #!/usr/bin/env bash
  declare -A n
  re='user=([a-z]+)'
  while IFS= read -r line; do
    [[ $line =~ $re ]] && (( ++n[${BASH_REMATCH[1]}] ))
  done < ~/logs/app.log
  for u in "${!n[@]}"; do echo "$u ${n[$u]}"; done | sort -k2,2nr -k1,1
expectedOutput: |
  alice 4
  bob 2
checks:
  - pattern: declare -A
    message: Count with an associative array.
hints:
  - "Capture the user with `[[ $line =~ user=([a-z]+) ]]`."
  - "Associative array order is random — sort the output."
explanation: "Regex capture plus a map counts in one pass without spawning a process per line."
