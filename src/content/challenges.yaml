id: performance-rewrite
title: Zero processes per line
difficulty: advanced
topic: Performance
lesson: performance
kind: script
prompt: "Print the login names of users in `/etc/passwd` whose home directory is under `/home`, one per line, using only `while read` and builtins (no external commands in the loop)."
starter: |
  #!/usr/bin/env bash
solution: |
  #!/usr/bin/env bash
  while IFS=: read -r user _ _ _ _ home _; do
    [[ $home == /home/* ]] && echo "$user"
  done < /etc/passwd
expectedOutput: |
  syslog
  learner
  deploy
checks:
  - pattern: \$\(
    forbid: true
    message: No command substitutions in the loop.
  - pattern: \b(cut|awk|grep)\b
    forbid: true
    message: Use read with IFS instead of external tools.
hints:
  - "`IFS=: read -r user _ _ _ _ home _` splits all seven fields."
explanation: "read splits the fields itself, so the loop never forks."
---
id: portable-mcq
title: Works on dash?
difficulty: advanced
topic: Portability
lesson: portability
kind: mcq
prompt: "Which line runs correctly under `#!/bin/sh` on Debian (dash)?"
options:
  - "`[[ -f $f ]] && echo yes`"
  - "`[ -f \"$f\" ] && echo yes`"
  - "`echo ${f^^}`"
  - "`files=(*.txt)`"
answer: 1
explanation: "`[ ]` with quoted variables is POSIX; `[[ ]]`, case conversion and arrays are Bash extensions."
