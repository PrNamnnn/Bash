id: inject-mcq
title: Spot the injection
difficulty: advanced
topic: Security
lesson: secure-scripting
kind: mcq
prompt: "A web hook passes a user-chosen `branch` to your deploy script. Which line is safe?"
options:
  - "`eval \"git checkout $branch\"`"
  - "`bash -c \"git checkout $branch\"`"
  - "`git checkout -- \"$branch\"`"
  - "`ssh build \"git checkout $branch\"`"
answer: 2
explanation: "Only the third passes the value as a single argument (after `--`) without a shell re-parsing it. Still validate it against an allow-list such as `^[A-Za-z0-9._/-]+$`."
