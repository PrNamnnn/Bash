id: case-dispatch
title: A tiny dispatcher
difficulty: intermediate
topic: case
lesson: case-statements
kind: script
prompt: "Write `svc ACTION` that prints `starting`, `stopping` or `status: running` for `start`, `stop` and `status`, and for anything else prints `usage: svc start|stop|status` to stderr and returns 2. The test calls are given."
starter: |
  #!/usr/bin/env bash
  svc() {
    :
  }
  svc start
  svc status
  svc reboot 2>&1; echo "rc=$?"
solution: |
  #!/usr/bin/env bash
  svc() {
    case ${1:-} in
      start)  echo starting ;;
      stop)   echo stopping ;;
      status) echo "status: running" ;;
      *)      echo "usage: svc start|stop|status" >&2; return 2 ;;
    esac
  }
  svc start
  svc status
  svc reboot 2>&1; echo "rc=$?"
expectedOutput: |
  starting
  status: running
  usage: svc start|stop|status
  rc=2
checks:
  - pattern: \bcase\b
    message: Use a case statement.
hints:
  - "The `*)` branch catches everything else."
explanation: "case is the idiomatic dispatcher for subcommands."
