id: error-modules
title: Who is failing?
difficulty: intermediate
topic: Log analysis
lesson: log-parsing
kind: command
prompt: "From `~/logs/app.log`, print each module (the bracketed word, without brackets) that logged at least one ERROR, with its count, as `uniq -c` output, most errors first."
solution: grep ' ERROR ' ~/logs/app.log | awk '{print $3}' | tr -d '[]' | sort | uniq -c | sort -rn
hints:
  - "The level is field 2 and the module field 3."
  - "`tr -d '[]'` removes the brackets."
explanation: "Filter, extract, normalise, count, rank — the canonical log pipeline."
