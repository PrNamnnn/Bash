id: deploy-scenario
title: The deploy that half-worked
difficulty: expert
topic: Deployment
lesson: deployment-scripts
kind: mcq
scenario: "Your deploy script runs `git pull && npm ci && systemctl restart app` directly in /srv/app. Today `npm ci` failed halfway: some packages are new, some old, and the site is throwing errors."
prompt: Which redesign prevents this class of failure?
options:
  - Run `npm ci` twice
  - "Build each release in its own directory, then switch a `current` symlink atomically after it's complete and verified"
  - Add `set -e`
  - Restart the service before running npm
answer: 1
explanation: "Building out of place means a failed build never touches what's serving traffic; the switch only happens once the new release is complete, and the old one stays available for rollback."
