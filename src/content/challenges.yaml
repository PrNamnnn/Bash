id: health-exit-codes
title: Worst status wins
difficulty: expert
topic: Monitoring
lesson: backups-and-health-checks
kind: script
prompt: "Given check results `0 1 0 2 1` (0 OK, 1 WARN, 2 CRIT), print `overall: CRIT` (or WARN/OK) for the worst one and exit with that number. Print `exit N` just before exiting."
starter: |
  #!/usr/bin/env bash
  results=(0 1 0 2 1)
solution: |
  #!/usr/bin/env bash
  results=(0 1 0 2 1)
  names=(OK WARN CRIT)
  worst=0
  for r in "${results[@]}"; do (( r > worst )) && worst=$r; done
  echo "overall: ${names[worst]}"
  echo "exit $worst"
  exit "$worst"
expectedOutput: |
  overall: CRIT
  exit 2
hints:
  - "Track the maximum value seen."
  - "Index an array of names with the number."
explanation: "Numeric severities make aggregation a max(), and map directly onto the monitoring-plugin exit codes."
