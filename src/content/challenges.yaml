id: subshell-predict
title: Where did my variable go?
difficulty: intermediate
topic: Subshells
lesson: subshells
kind: predict
prompt: What does this print?
code: |
  count=0
  printf 'a\nb\nc\n' | while read -r line; do count=$((count + 1)); done
  echo "pipe: $count"
  while read -r line; do count=$((count + 1)); done < <(printf 'a\nb\nc\n')
  echo "procsub: $count"
answer: |
  pipe: 0
  procsub: 3
explanation: The piped loop runs in a subshell, so its count is discarded; with process substitution the loop runs in the current shell.
