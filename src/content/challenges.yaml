id: cron-explain
title: When does it run?
difficulty: expert
topic: Scheduling
lesson: cron-and-scheduling
kind: mcq
prompt: "`*/20 9-17 * * 1-5` — when does this job run?"
options:
  - Every 20 hours on weekdays
  - At minutes 0, 20 and 40 of every hour from 09:00 to 17:40, Monday to Friday
  - At 09:20 and 17:20 on weekdays
  - Every 20 minutes, every day, between 9 and 17 minutes past the hour
answer: 1
explanation: "Minute `*/20` → 0, 20, 40; hours 9–17 inclusive; weekdays 1–5."
