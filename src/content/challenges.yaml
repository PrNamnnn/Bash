id: trap-cleanup
title: Always clean up
difficulty: intermediate
topic: Signals and traps
lesson: signals-and-trap
kind: script
prompt: "Create a temporary directory, register an EXIT trap that removes it and prints `cleaned`, create a file inside it, print `working`, and then fail with `false || exit 3`. The trap must still run."
starter: |
  #!/usr/bin/env bash
solution: |
  #!/usr/bin/env bash
  tmp=$(mktemp -d)
  trap 'rm -rf -- "$tmp"; echo cleaned' EXIT
  touch "$tmp/data"
  echo working
  false || exit 3
expectedOutput: |
  working
  cleaned
checks:
  - pattern: trap .*EXIT
    message: Use an EXIT trap.
  - pattern: mktemp
    message: Create the directory with mktemp.
hints:
  - "Single-quote the trap so `$tmp` is expanded when the trap runs."
explanation: "The EXIT trap runs on every way out of the script, including exit with an error status."
---
id: errexit-gotcha
title: The silent counter
difficulty: intermediate
topic: Error handling
lesson: error-handling
kind: find-bug
prompt: "With `set -e`, this script stops without printing anything. Which line causes the exit?"
code: |
  #!/usr/bin/env bash
  set -e
  errors=0
  grep -q ERROR ~/logs/app.log && (( errors++ ))
  echo "errors: $errors"
answer: 4
fix: |
  grep -q ERROR ~/logs/app.log && (( ++errors ))
hints:
  - "`(( expr ))` fails when the expression's value is 0. What is the value of `errors++` the first time?"
explanation: "Post-increment evaluates to the old value, 0, so `(( errors++ ))` returns status 1 — and as the last command of the `&&` list, set -e exits. Pre-increment returns 1."
