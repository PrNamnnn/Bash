id: exit-status-mcq
title: What does 0 mean?
difficulty: beginner
topic: Exit status
lesson: exit-status
kind: mcq
prompt: "`grep -q error app.log` prints nothing. Afterwards `$?` is `0`. What does that mean?"
options:
  - grep failed
  - The file contains at least one line matching error
  - The file is empty
  - grep found no matches
answer: 1
explanation: "Exit status 0 means success; for grep that means at least one match. 1 means no match, 2 means an error."
