id: array-loop
title: Safe list of files
difficulty: intermediate
topic: Arrays
lesson: indexed-arrays
kind: script
prompt: "Collect all `.txt` files directly in `~/downloads` into an array (names may contain spaces), then print `N text file(s):` followed by each name on its own line, prefixed with `- `."
starter: |
  #!/usr/bin/env bash
  cd ~/downloads
solution: |
  #!/usr/bin/env bash
  cd ~/downloads
  shopt -s nullglob
  files=(*.txt)
  echo "${#files[@]} text file(s):"
  printf -- '- %s\n' "${files[@]}"
expectedOutput: |
  1 text file(s):
  - notes (copy).txt
checks:
  - pattern: \bls\b
    forbid: true
    message: Use a glob, not ls.
hints:
  - "`files=(*.txt)` stores each match as one element."
  - "`printf` repeats its format for every argument."
explanation: "A glob into an array is the safe way to hold file names — spaces and all."
