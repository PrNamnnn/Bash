id: backoff-predict
title: Exponential backoff
difficulty: advanced
topic: Loops
lesson: while-and-until
kind: predict
prompt: What does this print?
code: |
  delay=1 max=10
  for attempt in 1 2 3 4 5; do
    printf '%d ' "$delay"
    delay=$(( delay * 2 > max ? max : delay * 2 ))
  done
  echo
answer: "1 2 4 8 10 "
acceptAnswers: ["1 2 4 8 10"]
explanation: "The delay doubles each time but is capped at max by the ternary operator."
