id: unique-regions
title: Which regions?
difficulty: beginner
topic: Text tools
lesson: cut-paste-tr
kind: command
prompt: "Print each distinct region in `~/data/sales.csv` (column 2) once, sorted alphabetically, without the header."
solution: tail -n +2 ~/data/sales.csv | cut -d, -f2 | sort -u
hints:
  - "`tail -n +2` starts at line 2."
  - "`sort -u` sorts and removes duplicates."
explanation: "Skip the header, cut the field, sort unique — a pattern you'll use constantly."
