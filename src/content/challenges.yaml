id: newest-file
title: The newest file
difficulty: beginner
topic: Files
lesson: listing-and-navigating
kind: command
prompt: "Print the name of the most recently modified entry in `~/logs` (one name only)."
solution: ls -t ~/logs | head -n 1
hints:
  - "`ls -t` sorts by modification time, newest first."
explanation: "`ls -t | head -n 1` is fine for a quick look; scripts that must handle odd names should use `find -printf` or a glob loop with `-nt`."
