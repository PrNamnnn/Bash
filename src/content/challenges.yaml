id: getopts-predict
title: Parsing options
difficulty: intermediate
topic: getopts
lesson: getopts
kind: predict
prompt: What does this print?
code: |
  set -- -vf out.txt input.csv
  v=0 f=""
  while getopts 'vf:' o; do
    case $o in v) v=1 ;; f) f=$OPTARG ;; esac
  done
  shift $((OPTIND - 1))
  echo "v=$v f=$f rest=$*"
answer: v=1 f=out.txt rest=input.csv
explanation: "getopts splits the combined `-vf`, takes `out.txt` as f's argument, and OPTIND points at input.csv."
