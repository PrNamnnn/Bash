id: dry-run-wrapper
title: A faithful dry run
difficulty: advanced
topic: Robust scripts
lesson: robust-patterns
kind: script
prompt: "Write `run` so that with `DRY_RUN=1` it prints `would run:` followed by the shell-quoted command, and otherwise executes it. Test it on a command with an argument containing spaces."
starter: |
  #!/usr/bin/env bash
  run() {
    :
  }
  DRY_RUN=1 run mv -- "my report.txt" /tmp/
  DRY_RUN=0 run echo "real run"
solution: |
  #!/usr/bin/env bash
  run() {
    if (( ${DRY_RUN:-0} )); then
      printf 'would run:'; printf ' %q' "$@"; echo
    else
      "$@"
    fi
  }
  DRY_RUN=1 run mv -- "my report.txt" /tmp/
  DRY_RUN=0 run echo "real run"
expectedOutput: |
  would run: mv -- my\ report.txt /tmp/
  real run
checks:
  - pattern: '%q'
    message: Quote the preview with printf %q.
hints:
  - "`\"$@\"` runs the command exactly as given."
  - "`printf ' %q' \"$@\"` prints each argument re-quoted."
explanation: "Because the preview is produced from the same argument list that would be executed, it can't drift from the real behaviour."
